name: Build Release APK

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    name: Build & Sign Android APK
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout ───────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Java (required by Gradle) ───────────────────────────────────────
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # ── 3. Flutter ────────────────────────────────────────────────────────
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.0'
          channel: 'stable'
          cache: true

      # ── 4. Install dependencies ───────────────────────────────────────────
      - name: Install Flutter dependencies
        run: flutter pub get

      # ── 5. Decode & write keystore from secret ────────────────────────────
      - name: Decode keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/app/chowgenie-release.jks

      # ── 6. Write key.properties so Gradle can read signing config ─────────
      - name: Write key.properties
        run: |
          cat > android/key.properties <<EOF
          storePassword=${{ secrets.KEY_STORE_PASSWORD }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          storeFile=chowgenie-release.jks
          EOF

      # ── 7. Build release APK ──────────────────────────────────────────────
      - name: Build release APK
        run: flutter build apk --release --split-per-abi

      # ── 8. Upload APKs as build artifacts ─────────────────────────────────
      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: chowgenie-release-apks
          path: build/app/outputs/flutter-apk/*.apk
          retention-days: 30

      # ── 9. Create GitHub Release on version tag ───────────────────────────
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/app/outputs/flutter-apk/*.apk
          generate_release_notes: true
          name: "ChowGenie ${{ github.ref_name }}"
          body: |
            ## ChowGenie Hybrid AI — ${{ github.ref_name }}

            ### Download
            Pick the APK for your device architecture:
            | File | Architecture |
            |------|-------------|
            | `app-arm64-v8a-release.apk` | Modern 64-bit Android (recommended) |
            | `app-armeabi-v7a-release.apk` | Older 32-bit Android |
            | `app-x86_64-release.apk` | Emulator / x86 devices |
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
